services:
  dockge:
    image: louislam/dockge:latest
    container_name: dockge-manager
    restart: unless-stopped
    ports:
      # Bind a 127.0.0.1 para acceso seguro vía Tailscale o puerto local
      - "${MANAGEMENT_BIND_IP:-127.0.0.1}:${DOCKGE_PORT:-5001}:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ../:/home/stacks
    environment:
      - DOCKGE_STACKS_DIR=/home/stacks
    deploy:
      resources:
        limits:
          memory: 512M
